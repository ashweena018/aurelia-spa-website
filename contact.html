<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aurelia Spa | Contact</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>

    <a class="logo" href="index.html">
      AURELIA<span>.</span>
    </a>

    <button id="menu">☰</button>

    <nav id="nav">

      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="booking.html">Booking</a>
      <a href="contact.html">Contact</a>

    </nav>

  </header>


  <!-- CONTACT PAGE -->
  <main class="page">

    <p class="eyebrow">
      ✦ AURELIA SPA
    </p>

    <h1>
      Contact
    </h1>

    <p class="lead">
      Discover a calm, modern and personalized wellness experience.
    </p>


    <!-- CONTACT FORM -->
    <form
      id="contactForm"
      class="form"
    >

      <input
        type="text"
        placeholder="Your name"
        required
      >

      <input
        type="email"
        placeholder="Your email"
        required
      >

      <textarea
        placeholder="Your message"
        required
      ></textarea>

      <button
        class="btn"
        type="submit"
      >
        Send Message
      </button>

      <p id="message"></p>

    </form>

  </main>


  <!-- FOOTER -->
  <footer>
    © 2026 Aurelia Spa
  </footer>


  <script src="script.js"></script>

</body>

</html>
